name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sonarr, radarr, prowlarr, bazarr, jellyfin-web, jellyfin]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: arr-packages
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix build .#packages.x86_64-linux.${{ matrix.package }} -L
