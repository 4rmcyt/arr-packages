name: auto-update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_deps:
        description: "Regenerate deps for the currently pinned version, without checking for a new release"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: arr-packages
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Bump every package to its latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # jellyfin-web must go first: jellyfin's version is pinned to match it.
          # One package failing must not lose the others' already-written changes.
          failed=0
          for pkg in jellyfin-web jellyfin sonarr radarr prowlarr bazarr; do
            if ! python3 scripts/update-package.py "$pkg" ${{ inputs.force_deps && '--force-deps' || '' }}; then
              echo "::warning::$pkg update failed, continuing with the rest"
              failed=1
            fi
          done
          exit $failed
      - name: Commit and push if anything changed
        id: commit
        if: always()
        run: |
          git config user.name "arr-packages-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- packages; then
            git add packages
            git commit -m "chore: bump package version(s) to latest upstream release"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing changed"
          fi
      # A push made with GITHUB_TOKEN doesn't trigger build.yml's `on: push`
      # (GitHub's anti-recursion rule) -- kick it off explicitly instead.
      - name: Trigger build workflow
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
