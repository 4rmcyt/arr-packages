name: auto-update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_deps:
        description: "Regenerate deps for the currently pinned version, without checking for a new release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: arr-packages
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Bump every package to its latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # jellyfin-web must go first: jellyfin's version is pinned to match it.
          # One package failing must not lose the others' already-written changes.
          failed=0
          for pkg in jellyfin-web jellyfin sonarr radarr prowlarr bazarr; do
            if ! python3 scripts/update-package.py "$pkg" ${{ inputs.force_deps && '--force-deps' || '' }}; then
              echo "::warning::$pkg update failed, continuing with the rest"
              failed=1
            fi
          done
          exit $failed

      - name: Commit and push if anything changed
        if: always()
        run: |
          git config user.name "arr-packages-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- packages; then
            git add packages
            git commit -m "chore: bump package version(s) to latest upstream release"
            git push
          else
            echo "nothing changed"
          fi
